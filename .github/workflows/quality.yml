name: Preverjanje kakovosti

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-26.04
    steps:
      - name: Prenesi izvorno kodo
        uses: actions/checkout@v7
      - name: Nastavi Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Namesti odvisnosti
        run: npm ci
      - name: Namesti brskalnike za teste
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Zaženi preizkuse celotne strani
        run: npm test